version: "2"
run:
  go: "1.26"
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - prealloc
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G104
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - prealloc
          - unparam
        path: _test\.go
      - linters:
          - staticcheck
        text: QF1008
      - linters:
          - staticcheck
        text: QF1002
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Vedooo/reactive-policy
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
