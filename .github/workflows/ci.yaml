---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Go module
        id: detect
        shell: bash
        run: |
          if [ -f go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No go.mod yet - Go checks activate once the module is scaffolded."
          fi

      - name: Set up Go
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        if: steps.detect.outputs.present == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # Generated output must be committed. This catches the case that bit us
      # once already: the chart ships plain copies of the CRDs under crds/, and a
      # stale copy silently prunes new API fields on a chart install.
      - name: Verify generated manifests are up to date
        if: steps.detect.outputs.present == 'true'
        run: make verify-manifests

      # Dependency/stdlib vulnerability scan. Non-blocking: stdlib findings track
      # the Go toolchain patch level and should inform, not gate, the pipeline.
      - name: govulncheck
        if: steps.detect.outputs.present == 'true'
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.3
          govulncheck ./...

      # `make test` wires up envtest (etcd + kube-apiserver) for controller tests.
      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: make test

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: yamllint
        run: yamllint -c .yamllint.yml .

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh

  actions:
    name: Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.1
        with:
          args: -color

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
