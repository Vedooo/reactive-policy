---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Go module
        id: detect
        shell: bash
        run: |
          if [ -f go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No go.mod yet - Go checks activate once the module is scaffolded."
          fi

      - name: Set up Go
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        if: steps.detect.outputs.present == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # Generated output must be committed. This catches the case that bit us
      # once already: the chart ships plain copies of the CRDs under crds/, and a
      # stale copy silently prunes new API fields on a chart install.
      - name: Verify generated manifests are up to date
        if: steps.detect.outputs.present == 'true'
        run: make verify-manifests

      # Dependency vulnerability scan.
      #
      # This step used to pin govulncheck@v1.1.3, which stopped compiling when
      # the toolchain moved to Go 1.26+ (its vendored x/tools is too old).
      # continue-on-error swallowed the build failure, so the scan silently
      # stopped running and three CVEs in transitive deps only surfaced through
      # Artifact Hub's image scan. It now installs @latest so it tracks the
      # toolchain, and the result is triaged rather than ignored wholesale.
      #
      # The triage script gates on reachable, non-stdlib findings only. stdlib
      # findings are fixed by whichever Go patch release the runner image
      # carries, so gating on them turns CI red for something no commit here can
      # fix — which is what the old continue-on-error was really working around.
      - name: govulncheck
        if: steps.detect.outputs.present == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -format json ./... > govulncheck.json || true
          python3 .github/scripts/triage-govulncheck.py govulncheck.json

      # `make test` wires up envtest (etcd + kube-apiserver) for controller tests.
      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: make test

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: yamllint
        run: yamllint -c .yamllint.yml .

      # The docs claim these rules are promtool-validated, so validate them.
      # A broken expr here is invisible until Prometheus refuses to load it.
      - name: promtool check rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "${GITHUB_WORKSPACE}/observability:/o" \
            prom/prometheus:v3.7.3 \
            check rules /o/prometheus-rules.yaml

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh

  actions:
    name: Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.1
        with:
          args: -color

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
