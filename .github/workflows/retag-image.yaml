name: Retag image

# Backfill or copy a published GHCR image tag without rebuilding. Created to
# add the v-stripped tag (e.g. `0.1.0`) for releases cut before v0.2.1, whose
# release workflow only pushed the `v`-prefixed variant — leaving the chart's
# default `image.tag` (matching `appVersion`) dangling and Artifact Hub's
# vulnerability scanner reporting "image not found". Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version tag to create (no leading v), e.g. 0.1.0"
        required: true
        type: string
      source-tag:
        description: "Existing source tag to copy from. Default: v<version>"
        required: false
        type: string
        default: ""
      also-latest:
        description: "Also retag :latest to this version. Only enable for the current Latest release."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  retag:
    name: Retag GHCR image
    runs-on: ubuntu-latest
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
          SOURCE_TAG_INPUT: ${{ inputs.source-tag }}
          ALSO_LATEST: ${{ inputs.also-latest }}
        run: |
          set -euo pipefail
          owner_lc="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lc}/reactive-policy"
          src="${SOURCE_TAG_INPUT:-v${VERSION}}"
          echo "Source: ${image}:${src}"
          echo "Target: ${image}:${VERSION}"
          tags=(--tag "${image}:${VERSION}")
          if [ "${ALSO_LATEST}" = "true" ]; then
            echo "Also tagging: ${image}:latest"
            tags+=(--tag "${image}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${image}:${src}"

      - name: Inspect result
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          owner_lc="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools inspect "ghcr.io/${owner_lc}/reactive-policy:${VERSION}"
