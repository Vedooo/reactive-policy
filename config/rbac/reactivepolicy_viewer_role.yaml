# permissions for end users to view reactivepolicies.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: reactive-policy
    app.kubernetes.io/managed-by: kustomize
  name: reactivepolicy-viewer-role
rules:
- apiGroups:
  - reactive-policy.io
  resources:
  - reactivepolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - reactive-policy.io
  resources:
  - reactivepolicies/status
  verbs:
  - get
