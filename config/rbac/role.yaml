---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - get
  - list
  - patch
  - update
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - reactive-policy.io
  resources:
  - actionaudits
  - reactivepolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - reactive-policy.io
  resources:
  - actionaudits/status
  - reactivepolicies/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - reactive-policy.io
  resources:
  - reactivepolicies/finalizers
  verbs:
  - update
