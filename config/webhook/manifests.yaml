---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-reactive-policy-io-v1alpha1-reactivepolicy
  failurePolicy: Fail
  name: vreactivepolicy-v1alpha1.kb.io
  rules:
  - apiGroups:
    - reactive-policy.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - reactivepolicies
  sideEffects: None
