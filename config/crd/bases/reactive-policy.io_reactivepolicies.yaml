---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: reactivepolicies.reactive-policy.io
spec:
  group: reactive-policy.io
  names:
    kind: ReactivePolicy
    listKind: ReactivePolicyList
    plural: reactivepolicies
    shortNames:
    - rp
    - rpolicy
    singular: reactivepolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.lastTriggeredAt
      name: Last Triggered
      type: date
    - jsonPath: .status.triggerCount
      name: Count
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ReactivePolicy is the Schema for the reactivepolicies API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ReactivePolicySpec defines the desired state of ReactivePolicy.
            properties:
              actions:
                description: |-
                  Actions is the ordered pipeline of plugin invocations run on trigger. At
                  least one action is required.
                items:
                  description: Action is a single plugin invocation in a policy's
                    pipeline.
                  properties:
                    onFailure:
                      default: stop
                      description: OnFailure controls pipeline behavior if this action
                        fails.
                      enum:
                      - continue
                      - stop
                      - rollback
                      type: string
                    params:
                      additionalProperties:
                        x-kubernetes-preserve-unknown-fields: true
                      description: Params are plugin-specific parameters, each value
                        being arbitrary JSON.
                      type: object
                    plugin:
                      description: Plugin is the registered plugin name, e.g. "notify.slack".
                      type: string
                    requiresApproval:
                      default: false
                      description: |-
                        RequiresApproval holds the pipeline immediately before this action until a
                        human decides. Actions ahead of the gate still run at trigger time, so a
                        pipeline can notify and annotate straight away and hold only its
                        destructive step. This action and every action after it wait for
                        `rp action approve`, and an undecided gate is denied once the policy's
                        approvalTimeout elapses (see ADR-011).
                      type: boolean
                  required:
                  - plugin
                  type: object
                minItems: 1
                type: array
              allowIrreversible:
                default: false
                description: |-
                  AllowIrreversible permits actions whose plugins are not reversible. When
                  false, the webhook rejects such policies.
                type: boolean
              approvalTimeout:
                default: 30m
                description: |-
                  ApprovalTimeout is how long a gated pipeline waits for a human decision
                  before the gate is denied. It is fail-closed by design: an expired gate
                  never runs the actions held behind it. Only meaningful when some action
                  sets requiresApproval. Bounds (min 1m, max 24h) are enforced by the
                  validating webhook.
                type: string
              audit:
                description: Audit configures ActionAudit record retention.
                properties:
                  retention:
                    default: 30d
                    description: |-
                      Retention is how long ActionAudit records are kept. Supports day ("30d")
                      and year ("1y") units beyond Go durations. Max 1y, enforced by the
                      validating webhook.
                    type: string
                type: object
              cooldown:
                default: 5m
                description: |-
                  Cooldown is the minimum time between successive triggers. Bounds (min 30s,
                  max 24h) are enforced by the validating webhook.
                type: string
              maxTriggersPerHour:
                default: 5
                description: |-
                  MaxTriggersPerHour caps how many times the policy may trigger in any
                  rolling one-hour window.
                format: int32
                maximum: 60
                minimum: 1
                type: integer
              observe:
                description: Observe defines the metric and threshold condition to
                  watch.
                properties:
                  authSecretRef:
                    description: |-
                      AuthSecretRef optionally references a bearer token for authenticating to
                      the metric source.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  duration:
                    description: |-
                      Duration is how long the threshold must stay crossed before triggering.
                      Bounds (min 30s, max 24h) are enforced by the validating webhook.
                    type: string
                  endpoint:
                    description: Endpoint is the full URL of the metric source HTTP
                      API.
                    type: string
                  operator:
                    description: Operator is the comparison relation between the value
                      and the threshold.
                    enum:
                    - GreaterThan
                    - GreaterThanOrEqual
                    - LessThan
                    - LessThanOrEqual
                    - Equal
                    - NotEqual
                    type: string
                  pollInterval:
                    default: 30s
                    description: |-
                      PollInterval is how often the metric source is queried. Bounds (min 10s,
                      max 5m) are enforced by the validating webhook.
                    type: string
                  query:
                    description: |-
                      Query is the PromQL query. It must return an instant vector with a single
                      sample.
                    type: string
                  source:
                    description: Source is the metric backend type. Only "prometheus"
                      in v0.1.
                    enum:
                    - prometheus
                    type: string
                  threshold:
                    description: |-
                      Threshold is the quantity-formatted number the metric value is compared
                      against, e.g. "0.05".
                    type: string
                required:
                - duration
                - endpoint
                - operator
                - query
                - source
                - threshold
                type: object
              target:
                description: Target selects the resources the policy's actions operate
                  on.
                properties:
                  kinds:
                    description: Kinds is the set of resource kinds to match. At least
                      one, at most ten.
                    items:
                      description: |-
                        TargetKind identifies a Kubernetes resource kind that a policy's actions may
                        operate on.
                      properties:
                        apiVersion:
                          description: |-
                            APIVersion is the group/version of the kind, e.g. "apps/v1" or
                            "argoproj.io/v1alpha1".
                          type: string
                        kind:
                          description: Kind is the resource kind, e.g. "Deployment"
                            or "Application".
                          type: string
                      required:
                      - apiVersion
                      - kind
                      type: object
                    maxItems: 10
                    minItems: 1
                    type: array
                  maxResources:
                    default: 10
                    description: |-
                      MaxResources is a safety cap: if the selector matches more resources than
                      this, the policy refuses to act.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  selector:
                    description: Selector is a standard label selector matched against
                      candidate resources.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - kinds
                - selector
                type: object
            required:
            - actions
            - observe
            - target
            type: object
          status:
            description: |-
              ReactivePolicyStatus defines the observed state of ReactivePolicy. It is
              written by the controller; users should not edit it.
            properties:
              conditions:
                description: Conditions is the standard set of condition objects for
                  the policy.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentMetricValue:
                description: CurrentMetricValue is the most recently observed metric
                  value.
                type: string
              lastEvaluatedAt:
                description: LastEvaluatedAt is the time of the most recent metric
                  evaluation.
                format: date-time
                type: string
              lastTriggeredAt:
                description: LastTriggeredAt is the time of the most recent successful
                  trigger.
                format: date-time
                type: string
              pendingGateRef:
                description: |-
                  PendingGateRef is the name of the ActionAudit holding an open approval
                  gate for this policy. While it is set the policy will not trigger again,
                  so a metric that stays bad cannot queue a second gate behind the first.
                  The controller clears it once the gate is decided or expires.
                type: string
              state:
                description: State is a coarse summary of the policy's lifecycle position.
                enum:
                - Watching
                - Triggering
                - AwaitingApproval
                - Cooldown
                - RateLimited
                - Invalid
                type: string
              triggerCount:
                description: TriggerCount is the total number of triggers since policy
                  creation.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
