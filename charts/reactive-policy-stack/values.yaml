# Default values for the reactive-policy-stack umbrella chart.
#
# This chart wraps the lean reactive-policy operator and, optionally, the
# community kube-prometheus-stack. There are two modes:
#
#   * Bundle (default): install kube-prometheus-stack alongside the operator so
#     a fresh cluster gets Prometheus, Alertmanager, and Grafana out of the box.
#   * Bring your own: set `kube-prometheus-stack.enabled=false` and point each
#     ReactivePolicy's `spec.observe.endpoint` at your existing Prometheus.
#
# Values for a subchart are nested under its name. See
# charts/reactive-policy/values.yaml for the operator's full set, and the
# upstream kube-prometheus-stack chart for its many options.

# -- Values passed through to the reactive-policy operator subchart. The
# ServiceMonitor and PrometheusRule are on by default here because the stack
# ships a Prometheus Operator to consume them.
reactive-policy:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
  audit:
    # -- Operator's sink backend. Set to "postgres" to forward audit events
    # -- to the bundled Cluster (or your own Postgres).
    sink: none
    postgres:
      dsnEnv: RP_AUDIT_POSTGRES_DSN
      dsnSecret:
        # -- The CNPG app-user secret named after audit.clusterName.
        name: rp-audit-app
        key: uri

# -- The community kube-prometheus-stack. Only a few defaults are overridden;
# everything else uses the upstream chart's defaults.
kube-prometheus-stack:
  # -- Install kube-prometheus-stack (Prometheus Operator, Prometheus,
  # Alertmanager, Grafana, node-exporter, kube-state-metrics). Set to false to
  # use an existing monitoring stack instead.
  enabled: true
  prometheus:
    prometheusSpec:
      # -- Discover ServiceMonitors, PodMonitors, and PrometheusRules
      # cluster-wide rather than only those carrying this release's label, so
      # reactive-policy's own monitors are scraped without extra labelling.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

# Bundled DB-backed audit history (optional). When audit.enabled=true the
# umbrella renders a CloudNativePG Cluster CR named audit.clusterName, which
# creates a Secret <clusterName>-app containing a "uri" key. Wire the operator
# to that secret via reactive-policy.audit.postgres.dsnSecret (already set
# below to match the default clusterName).
#
# Three things must line up to flip everything on:
#   audit.enabled=true                       (renders the Cluster CR)
#   cloudnative-pg.enabled=true              (installs the CNPG operator)
#   reactive-policy.audit.sink=postgres      (operator forwards events)
audit:
  enabled: false
  # -- Name of the CNPG Cluster CR created when audit.enabled. The app-user
  # secret CNPG produces is "<clusterName>-app".
  clusterName: rp-audit
  # -- Number of Postgres instances. >=3 gives HA via streaming replication.
  instances: 1
  storage:
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# -- CloudNativePG operator. Default off; flip to true alongside audit.enabled.
cloudnative-pg:
  enabled: false
