# Default values for reactive-policy.
# Every value below is documented inline. Override with `--set` or a custom
# values file: `helm install reactive-policy ... -f my-values.yaml`.

# -- Number of operator replicas. Leader election ensures only one is active at
# a time, so values >1 give warm standby for HA without split-brain.
replicaCount: 1

image:
  # -- Operator container image repository.
  repository: ghcr.io/vedooo/reactive-policy
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart's appVersion when left empty.
  tag: ""

# -- Image pull secrets for private registries.
imagePullSecrets: []

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the fully-qualified release name used in resource names.
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount for the operator.
  create: true
  # -- Annotations to add to the ServiceAccount (e.g. IRSA / Workload Identity).
  annotations: {}
  # -- ServiceAccount name. Generated from the release name when empty.
  name: ""

rbac:
  # -- Create the ClusterRole/ClusterRoleBinding the operator needs. The
  # ClusterRole aggregates every built-in plugin's required permissions
  # (docs/ARCHITECTURE.md §3.3). Disable only if you manage RBAC out of band.
  create: true

# -- Pod-level annotations (e.g. for scraping or config-hash rollouts).
podAnnotations: {}
# -- Pod-level labels.
podLabels: {}

# -- Pod security context applied to the operator pod.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container security context. Defaults follow the restricted Pod Security
# Standard: no privilege escalation, all capabilities dropped, read-only root.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# -- Compute resources for the operator container.
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# -- Node selector for scheduling the operator pod.
nodeSelector: {}
# -- Tolerations for scheduling the operator pod.
tolerations: []
# -- Affinity rules for scheduling the operator pod.
affinity: {}

# -- Enable leader election. Required when replicaCount > 1; harmless at 1.
leaderElection:
  enabled: true

metrics:
  # -- Expose the operator's own Prometheus metrics (docs/ARCHITECTURE.md §8).
  enabled: true
  # -- Address the metrics endpoint binds to inside the pod.
  bindAddress: ":8080"
  # -- Serve metrics over HTTPS with authn/authz. Left false for a frictionless
  # default scrape; set true and front with the metrics-auth RBAC for hardened
  # clusters.
  secure: false
  # -- Service port that exposes the metrics endpoint.
  port: 8080

serviceMonitor:
  # -- Create a Prometheus Operator ServiceMonitor for the metrics endpoint.
  # Requires the Prometheus Operator CRDs to be installed.
  enabled: false
  # -- Scrape interval.
  interval: 30s
  # -- Scrape timeout.
  scrapeTimeout: 10s
  # -- Extra labels for the ServiceMonitor (e.g. release: kube-prometheus-stack).
  labels: {}

prometheusRule:
  # -- Create a PrometheusRule with the example alerts from
  # observability/prometheus-rules.yaml. Requires the Prometheus Operator CRDs.
  enabled: false
  # -- Extra labels for the PrometheusRule (e.g. release: kube-prometheus-stack).
  labels: {}

webhook:
  # -- Enable the admission webhooks. When false (the default) the operator runs
  # with ENABLE_WEBHOOKS=false and no webhook configurations are created, so the
  # chart installs cleanly without cert-manager. Enabling it serves two
  # webhooks: policy validation, and the approval handler that stamps an
  # approver's identity from the authenticated request. Approval gates work
  # without it, but their identity and write-once guarantees do not.
  enabled: false
  # -- Port the webhook server listens on inside the pod.
  port: 9443
  # -- failurePolicy for both webhook configurations. `Fail` is the safe choice:
  # an unreachable webhook rejects the write rather than admitting an unchecked
  # policy or an unstamped approval. Use `Ignore` only if you would rather lose
  # the guarantees than block writes during an operator outage.
  failurePolicy: Fail
  certManager:
    # -- Issue the serving certificate with cert-manager. Requires cert-manager
    # in the cluster; the chart creates a self-signed Issuer and a Certificate,
    # and annotates the webhook configurations so the CA bundle is injected.
    enabled: true
    # -- Use an existing Issuer or ClusterIssuer instead of the self-signed one
    # the chart creates, e.g. {name: my-ca, kind: ClusterIssuer}.
    issuerRef: {}
  # -- Bring your own certificate instead of cert-manager. The Secret must hold
  # tls.crt and tls.key, and caBundle must be the base64-encoded CA that signed
  # it. Set certManager.enabled=false when using this.
  existingSecret: ""
  # -- Base64-encoded CA bundle for existingSecret.
  caBundle: ""

audit:
  # -- Audit sink backend. One of: none, postgres. The default no-op keeps the
  # operator dependency-free; the ActionAudit CRD is source of truth either way.
  sink: none
  # -- In-process queue size when sink=postgres.
  queueSize: 1024
  postgres:
    # -- Environment variable on the operator container that holds the DSN.
    dsnEnv: RP_AUDIT_POSTGRES_DSN
    # -- Existing Secret to read the DSN from. When unset and sink=postgres,
    # the operator expects the DSN env var to be provided some other way.
    dsnSecret:
      name: ""
      key: uri
