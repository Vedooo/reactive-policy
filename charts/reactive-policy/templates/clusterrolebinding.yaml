{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "reactive-policy.fullname" . }}-manager
  labels:
    {{- include "reactive-policy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "reactive-policy.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "reactive-policy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
