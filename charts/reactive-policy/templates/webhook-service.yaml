{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "reactive-policy.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reactive-policy.labels" . | nindent 4 }}
spec:
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: webhook
  selector:
    {{- include "reactive-policy.selectorLabels" . | nindent 4 }}
{{- end }}
