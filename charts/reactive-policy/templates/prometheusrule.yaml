{{- if .Values.prometheusRule.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "reactive-policy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reactive-policy.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- /*
    The rules are read verbatim from files/prometheus-rules.yaml, which `make
    sync-alerts` copies from observability/. They used to be duplicated inline
    here, which meant every new alert had to be written twice and the copy
    quietly fell behind. Reading the file also means Prometheus' own
    {{ $labels.x }} templating needs no escaping: .Files.Get returns raw text
    that Helm does not re-render.
  */}}
  {{- .Files.Get "files/prometheus-rules.yaml" | nindent 2 }}
{{- end }}
