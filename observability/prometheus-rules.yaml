# Example alerting rules for the reactive-policy operator's own metrics
# (docs/ARCHITECTURE.md §8). Adapt thresholds to your environment.
#
# This file is in the native Prometheus rules format so it validates with
# `promtool check rules observability/prometheus-rules.yaml`. To deploy with the
# Prometheus Operator, nest the `groups` below under the `spec:` of a
# PrometheusRule resource — the Week 8 Helm chart does exactly that.
groups:
  - name: reactive-policy.rules
    rules:
      - alert: ReactivePolicyOperatorDown
        expr: up{job=~".*reactive-policy.*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: reactive-policy operator is down
          description: >-
            The reactive-policy operator metrics endpoint (job {{ $labels.job }})
            has been unscrapeable for 5 minutes. Policies are not being evaluated.

      - alert: HighActionFailureRate
        expr: |
          sum(rate(reactive_policy_actions_total{result="Failed"}[5m]))
            /
          sum(rate(reactive_policy_actions_total[5m]))
            > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High reactive-policy action failure rate
          description: >-
            More than 50% of action executions have failed over the last 5
            minutes. Inspect ActionAudit records and plugin permissions.

      - alert: PolicyRateLimitHit
        expr: sum by (namespace) (increase(reactive_policy_rate_limited_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A reactive-policy is hitting its rate limit
          description: >-
            Policies in namespace {{ $labels.namespace }} hit their
            maxTriggersPerHour cap in the last 10 minutes; a metric may be
            flapping or the cap may be set too low.

      - alert: HighPrometheusQueryErrorRate
        expr: rate(reactive_policy_prometheus_query_errors_total[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: reactive-policy metric-source queries are failing
          description: >-
            The operator is failing more than 0.1 metric-source queries per
            second over the last 5 minutes; check endpoint reachability and auth.

      - alert: ApprovalGatePending
        expr: sum by (namespace) (reactive_policy_approval_gates_pending) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: An action pipeline is waiting on a human decision
          description: >-
            A pipeline in namespace {{ $labels.namespace }} has been holding for
            an approval for 10 minutes. It stopped mid-incident and will expire
            closed — its held actions never run — once approvalTimeout elapses.
            Review it with `rp action pending -n {{ $labels.namespace }}`.

      - alert: ApprovalGateExpired
        expr: sum by (namespace) (increase(reactive_policy_approval_decisions_total{outcome="expired"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: An approval gate expired without a decision
          description: >-
            A gated pipeline in namespace {{ $labels.namespace }} was denied by
            expiry in the last hour: nobody answered, so the actions it held were
            dropped. Either the gate is not visible to whoever should be
            answering, or approvalTimeout is shorter than your response time.

      - alert: PluginValidationFailing
        expr: sum by (plugin) (increase(reactive_policy_plugin_validation_errors_total[15m])) > 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: reactive-policy plugin validation failures
          description: >-
            Plugin {{ $labels.plugin }} rejected policy parameters at admission
            in the last 15 minutes. A user may be submitting invalid policies.
